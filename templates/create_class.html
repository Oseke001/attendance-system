<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Class — Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container" style="max-width: 500px; margin-top: 30px;">

        <h2>Create New Class</h2>
        <p style="color: var(--text-muted);">Enter class details below. A unique 8-character class code will be auto-generated.</p>

        <form method="POST">

            <div class="form-group">
                <label for="name">Class Name / Subject Code</label>
                <input type="text" id="name" name="name" placeholder="e.g. CPT 101 — Computer Science" required>
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 10px;">Create Class</button>

        </form>

        <hr>

        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">← Back to Dashboard</a>

    </div>

</body>
</html>
